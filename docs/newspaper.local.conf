# Apache vhost for the newspaper site.
#
# Install:
#   sudo cp /var/www/html/newspaper/docs/newspaper.local.conf /etc/apache2/sites-available/
#   sudo a2ensite newspaper.local
#   echo "127.0.0.1 newspaper.local" | sudo tee -a /etc/hosts
#   sudo systemctl reload apache2
#
# Then set APP_URL=http://newspaper.local in .env and run:
#   php artisan config:clear
#
# The global <Directory /var/www/> block sets AllowOverride None, which is why
# a per-project vhost is needed for Laravel's public/.htaccess rewrites.

<VirtualHost *:80>
    ServerName newspaper.local
    DocumentRoot /var/www/html/newspaper/public

    <Directory /var/www/html/newspaper/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Ubuntu's /etc/mime.types has no entry for webp, so Apache serves the
    # whole derivative ladder with no Content-Type at all and leaves the
    # browser to sniff it. Declare it here.
    AddType image/webp .webp
    AddType image/avif .avif

    ErrorLog  ${APACHE_LOG_DIR}/newspaper-error.log
    CustomLog ${APACHE_LOG_DIR}/newspaper-access.log combined
</VirtualHost>
