# Apache vhost for the newspaper site.
#
# Install:
#   sudo cp /var/www/html/newspaper/docs/newspaper.local.conf /etc/apache2/sites-available/
#   sudo a2ensite newspaper.local
#   echo "127.0.0.1 newspaper.local" | sudo tee -a /etc/hosts
#   sudo systemctl reload apache2
#
# mod_deflate, mod_expires and mod_headers are all used below:
#   sudo a2enmod deflate expires headers rewrite
#
# Then set APP_URL=http://newspaper.local in .env and run:
#   php artisan config:clear
#
# The global <Directory /var/www/> block sets AllowOverride None, which is why
# a per-project vhost is needed for Laravel's public/.htaccess rewrites.

<VirtualHost *:80>
    ServerName newspaper.local
    DocumentRoot /var/www/html/newspaper/public

    <Directory /var/www/html/newspaper/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Ubuntu's /etc/mime.types has no entry for webp, so Apache serves the
    # whole derivative ladder with no Content-Type at all and leaves the
    # browser to sniff it. Declare it here.
    AddType image/webp .webp
    AddType image/avif .avif

    # Without these two blocks a Lighthouse run scores the *server*, not the
    # site: uncompressed, the homepage document alone is 276 KB and the built
    # CSS 83 KB, which cost ~1.6s of "enable text compression" and dropped
    # mobile performance from 99 to 83. Never compress the derivative ladder —
    # WebP and JPEG are already compressed and gzip only adds CPU.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml \
            application/javascript application/json application/manifest+json \
            image/svg+xml
    </IfModule>

    # Vite output is content-hashed and uploads are stored under a random name,
    # so both are safe to treat as immutable.
    <LocationMatch "^/(build|storage)/">
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
        </IfModule>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/newspaper-error.log
    CustomLog ${APACHE_LOG_DIR}/newspaper-access.log combined
</VirtualHost>
